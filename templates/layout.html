
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% if title %}
        <title>FastAPI Blog - {{ title }}</title>
    {% else %}
        <title>FastAPI Blog</title>
    {% endif %}

    <meta name="description" content="A blog about FastAPI and Python development">
    <meta name="author" content="Aman">
    <meta name="theme-color" content="#527c9f">

    <!-- Apply saved theme before rendering -->
    <script>
        (() => {
            const savedTheme = localStorage.getItem("theme") || "auto";
            const systemDark = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

            document.documentElement.setAttribute(
                "data-bs-theme",
                savedTheme === "auto"
                    ? (systemDark ? "dark" : "light")
                    : savedTheme
            );
        })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Custom Styling -->
    <style>
        body {
            font-family: "Nunito", sans-serif;
            background-color: var(--bs-tertiary-bg);
            color: var(--bs-body-color);
        }

        .navbar {
            background-color: #343a40;
        }

        .navbar-brand {
            font-family: "Montserrat", sans-serif;
            font-weight: 700;
        }

        main {
            padding-top: 100px;
            padding-bottom: 40px;
        }

        .content-section {
            background-color: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            border-radius: 10px;
        }

        .article-title {
            color: var(--bs-emphasis-color);
            text-decoration: none;
        }

        .article-title:hover {
            color: var(--bs-primary);
        }

        .list-group-item {
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            border-color: var(--bs-border-color);
        }

        footer {
            background-color: var(--bs-tertiary-bg);
            border-color: var(--bs-border-color) !important;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <header>
        <nav class="navbar navbar-expand-md navbar-dark fixed-top">
            <div class="container">

                <a class="navbar-brand me-4"
                   href="{{ url_for('home') }}">
                    FastAPI Blog
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarToggle"
                        aria-controls="navbarToggle"
                        aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarToggle">

                    <div class="navbar-nav me-auto">
                        <a class="nav-link"
                           href="{{ url_for('home') }}">
                            Home
                        </a>

                        <a class="nav-link" href="/api/posts">
                            Posts API
                        </a>
                    </div>

                    <!-- Theme Selector -->
                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle"
                                type="button"
                                id="bd-theme"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                            <span id="bd-theme-text">🌗 Auto</span>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end"
                            aria-labelledby="bd-theme">

                            <li>
                                <button class="dropdown-item"
                                        type="button"
                                        data-bs-theme-value="light">
                                    🌝 Light
                                </button>
                            </li>

                            <li>
                                <button class="dropdown-item"
                                        type="button"
                                        data-bs-theme-value="dark">
                                    🌚 Dark
                                </button>
                            </li>

                            <li>
                                <button class="dropdown-item"
                                        type="button"
                                        data-bs-theme-value="auto">
                                    🌗 Auto
                                </button>
                            </li>
                        </ul>
                    </div>

                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container flex-grow-1">
        <div class="row g-4">

            <div class="col-md-8">
                {% block content %}
                {% endblock content %}
            </div>

            <!-- Sidebar -->
            <aside class="col-md-4">
                <div class="content-section p-4 mb-4">

                    <h3 class="h5">About the Blog</h3>

                    <p class="text-body-secondary">
                        Thoughts, stories, and ideas about FastAPI
                        and Python development.
                    </p>

                    <hr>

                    <h3 class="h6">Explore</h3>

                    <ul class="list-group">
                        <li class="list-group-item">
                            <a class="text-decoration-none"
                               href="{{ url_for('home') }}">
                                Latest Posts
                            </a>
                        </li>

                        <li class="list-group-item">
                            <a class="text-decoration-none"
                               href="/api/posts">
                                Posts API
                            </a>
                        </li>
                    </ul>

                </div>
            </aside>

        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-3 border-top">
        <div class="container text-center">
            <p class="text-body-secondary mb-0">
                &copy; <span id="year"></span> FastAPI Blog · By Aman
            </p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <!-- Theme Selector -->
    <script>
        const themeText = {
            light: "🌝 Light",
            dark: "🌚 Dark",
            auto: "🌗 Auto"
        };

        function setTheme(theme) {
            const systemDark = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

            const actualTheme = theme === "auto"
                ? (systemDark ? "dark" : "light")
                : theme;

            document.documentElement.setAttribute(
                "data-bs-theme",
                actualTheme
            );

            localStorage.setItem("theme", theme);

            document.getElementById("bd-theme-text").textContent =
                themeText[theme];
        }

        document.querySelectorAll("[data-bs-theme-value]")
            .forEach(button => {
                button.addEventListener("click", () => {
                    setTheme(button.getAttribute("data-bs-theme-value"));
                });
            });

        // Initialize theme selector
        setTheme(localStorage.getItem("theme") || "auto");

        // Update automatic theme when system preference changes
        window.matchMedia("(prefers-color-scheme: dark)")
            .addEventListener("change", () => {
                if ((localStorage.getItem("theme") || "auto") === "auto") {
                    setTheme("auto");
                }
            });

        // Footer year
        document.getElementById("year").textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
